$kind: http-request
description: availability must be AVAILABLE or UNAVAILABLE.
url: "{{baseUrl}}/api/volunteers/{{volunteerId}}/availability"
method: PUT
headers:
  Content-Type: application/json
  Authorization: Bearer {{volunteerToken}}
body:
  type: json
  content: |-
    {
      "availability": "AVAILABLE"
    }
order: 4000
